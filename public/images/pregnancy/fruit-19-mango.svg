<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1025 314" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF7F2"/>
      <stop offset="50%" stop-color="#F8ECE4"/>
      <stop offset="100%" stop-color="#F5E6DD"/>
    </linearGradient>
    <linearGradient id="mangoGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#E85338"/>
      <stop offset="35%" stop-color="#F59325"/>
      <stop offset="75%" stop-color="#F7BA2A"/>
      <stop offset="100%" stop-color="#A5B838"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#803520" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1025" height="314" rx="20" fill="url(#bgGrad)"/>

  <!-- Left Foliage -->
  <g opacity="0.45" stroke="#CBB4A3" stroke-width="2" fill="none">
    <path d="M 40,280 C 90,200 130,120 220,90" />
    <path d="M 120,290 C 180,220 230,160 310,130" />
    <path d="M 20,160 C 80,140 160,150 240,190" />
    <path d="M 70,60 C 130,80 180,120 230,180" />
  </g>
  <g opacity="0.5" fill="#BFA997">
    <ellipse cx="110" cy="190" rx="36" ry="16" transform="rotate(-30 110 190)"/>
    <ellipse cx="170" cy="140" rx="40" ry="17" transform="rotate(-15 170 140)"/>
    <ellipse cx="230" cy="100" rx="34" ry="15" transform="rotate(20 230 100)"/>
    <ellipse cx="90" cy="100" rx="30" ry="14" transform="rotate(45 90 100)"/>
    <ellipse cx="190" cy="220" rx="38" ry="16" transform="rotate(35 190 220)"/>
    <ellipse cx="260" cy="180" rx="35" ry="15" transform="rotate(-20 260 180)"/>
  </g>
  <g opacity="0.38" fill="#5F7D8E">
    <path d="M 140,250 C 160,210 200,200 240,220 C 220,260 180,270 140,250 Z"/>
    <path d="M 260,110 C 290,80 330,90 340,120 C 310,140 280,130 260,110 Z"/>
    <path d="M 60,220 C 80,180 120,190 130,220 C 110,240 80,240 60,220 Z"/>
  </g>

  <!-- Right Foliage -->
  <g opacity="0.45" stroke="#CBB4A3" stroke-width="2" fill="none">
    <path d="M 985,280 C 935,200 895,120 805,90" />
    <path d="M 905,290 C 845,220 795,160 715,130" />
    <path d="M 1005,160 C 945,140 865,150 785,190" />
    <path d="M 955,60 C 895,80 845,120 795,180" />
  </g>
  <g opacity="0.5" fill="#BFA997">
    <ellipse cx="915" cy="190" rx="36" ry="16" transform="rotate(30 915 190)"/>
    <ellipse cx="855" cy="140" rx="40" ry="17" transform="rotate(15 855 140)"/>
    <ellipse cx="795" cy="100" rx="34" ry="15" transform="rotate(-20 795 100)"/>
    <ellipse cx="935" cy="100" rx="30" ry="14" transform="rotate(-45 935 100)"/>
    <ellipse cx="835" cy="220" rx="38" ry="16" transform="rotate(-35 835 220)"/>
    <ellipse cx="765" cy="180" rx="35" ry="15" transform="rotate(20 765 180)"/>
  </g>
  <g opacity="0.38" fill="#5F7D8E">
    <path d="M 885,250 C 865,210 825,200 785,220 C 805,260 845,270 885,250 Z"/>
    <path d="M 765,110 C 735,80 695,90 685,120 C 715,140 745,130 765,110 Z"/>
    <path d="M 965,220 C 945,180 905,190 895,220 C 915,240 945,240 965,220 Z"/>
  </g>

  <!-- Central Fruit: Large Mango -->
  <g transform="translate(512, 160)" filter="url(#shadow)">
    <!-- Mango Leaf and Stem -->
    <path d="M -15,-70 C -35,-95 -75,-105 -95,-95 C -105,-75 -85,-55 -55,-55 Z" fill="#3E6B48"/>
    <path d="M -55,-55 C -35,-45 -20,-55 -15,-70 Z" fill="#2B4D33"/>
    <path d="M 2,-75 C 6,-95 18,-102 22,-98 C 18,-90 10,-82 4,-72 Z" fill="#6A5333"/>
    
    <!-- Mango Fruit Contour -->
    <path d="M 0,-70 C 45,-68 78,-25 80,25 C 82,75 52,102 15,100 C -35,97 -78,60 -75,0 C -72,-55 -35,-72 0,-70 Z" fill="url(#mangoGrad)"/>
    <!-- Highlight -->
    <path d="M -25,-45 C 5,-48 35,-20 40,15 C 20,15 -10,-10 -35,-15 C -42,-30 -38,-42 -25,-45 Z" fill="#FFF2B2" opacity="0.45"/>
  </g>
</svg>
