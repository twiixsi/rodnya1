<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 80" fill="none">
  <!-- Heart and Family Icon -->
  <g transform="translate(10, 10)">
    <!-- Stylized Heart Outline -->
    <path d="M30 55 C12 40, 2 28, 2 17 C2 7, 10 2, 19 2 C25 2, 28 6, 30 10 C32 6, 35 2, 41 2 C50 2, 58 7, 58 17 C58 28, 48 40, 30 55 Z" 
          stroke="#E58A7D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Mother Figure (Left) -->
    <circle cx="21" cy="19" r="4.5" stroke="#34785D" stroke-width="2.5" fill="#FFFDF9"/>
    <path d="M12 36 C12 28, 17 26, 21 26 C25 26, 30 28, 30 36" stroke="#34785D" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Father Figure (Right) -->
    <circle cx="39" cy="17" r="4.5" stroke="#245B49" stroke-width="2.5" fill="#FFFDF9"/>
    <path d="M30 36 C30 27, 35 25, 39 25 C43 25, 48 27, 48 36" stroke="#245B49" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Child Figure (Center) -->
    <circle cx="30" cy="27" r="3.2" stroke="#E58A7D" stroke-width="2.2" fill="#FFFDF9"/>
    <path d="M24 41 C24 35, 27 33, 30 33 C33 33, 36 35, 36 41" stroke="#E58A7D" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Typography: Brand Name -->
  <text x="82" y="44" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="26" fill="#283D38" letter-spacing="-0.5">Родные люди</text>
  
  <!-- Divider -->
  <line x1="262" y1="26" x2="262" y2="52" stroke="#D3C7BC" stroke-width="1.5"/>

  <!-- Slogan -->
  <text x="276" y="42" font-family="'Caveat', cursive, sans-serif" font-weight="600" font-size="18" fill="#6B7C77">Забота. Поддержка. Будущее.</text>
</svg>
